<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Solutions ERP</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e3e6ea;--ac:#0f766e;--ac2:#fff;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2125;--tx:#e8eaed;--mu:#9aa3ad;--bd:#2c3238;--ac:#2dd4bf;--ac2:#0b1514;--bad:#f97066}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2125;--tx:#e8eaed;--mu:#9aa3ad;--bd:#2c3238;--ac:#2dd4bf;--ac2:#0b1514;--bad:#f97066}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px}
header{padding:14px 16px 0;font-weight:700;font-size:18px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
main{padding:0 16px 24px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{background:var(--ac);color:var(--ac2);border:0;padding:9px 16px;border-radius:8px;font:inherit;cursor:pointer}
.btn.s{background:transparent;color:var(--ac);border:1px solid var(--bd);padding:4px 10px;font-size:13px}
.btn.d{color:var(--bad)}
.w{overflow-x:scroll;scrollbar-width:auto;scrollbar-color:var(--ac) var(--bd);padding-bottom:6px}
.w::-webkit-scrollbar{height:14px}.w::-webkit-scrollbar-track{background:var(--bd);border-radius:7px}.w::-webkit-scrollbar-thumb{background:var(--ac);border-radius:7px}
.w table{min-width:640px}
#scn{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px}
.sc{background:var(--card);border-radius:12px;padding:12px;width:100%;max-width:420px}.sc video{width:100%;border-radius:8px;background:#000;max-height:50vh}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:12px}
.k{display:flex;gap:10px;flex-wrap:wrap}.k div{flex:1;min-width:130px;background:var(--bg);border-radius:10px;padding:10px}
.k b{display:block;font-size:18px;margin-top:2px}
.p{color:var(--ac)}.n{color:var(--bad)}.mu{color:var(--mu);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#lock{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#lock .sc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;width:100%;max-width:460px}
#dv{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:150;display:flex;flex-direction:column;padding:10px}
#dvf{flex:1;width:100%;background:#fff;border:0;border-radius:8px}
#pdfcov{position:fixed;inset:0;background:var(--bg);color:var(--tx);z-index:400;display:flex;align-items:center;justify-content:center;font-size:18px}
.mic{position:absolute;left:6px;bottom:6px;border:0;background:transparent;font-size:16px;cursor:pointer;padding:2px;line-height:1}
.mic.fl{position:static;flex:none}.mic.rec{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25}}
input.hasmic{padding-left:32px}
.acl{position:absolute;right:0;left:0;top:100%;z-index:60;background:var(--card);border:1px solid var(--bd);border-radius:8px;max-height:220px;overflow:auto;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.aci{padding:9px 10px;border-bottom:1px solid var(--bd);cursor:pointer}.aci:hover{background:var(--bg)}
</style></head><body>
<header dir="ltr" style="text-align:right">📒 Smart Solutions ERP</header>
<div style="padding:6px 16px 0"><button id="inst" class="btn" style="display:none" onclick="doInstall()">📲 تثبيت التطبيق</button></div>
<div id="lic" class="mu" style="padding:2px 16px"></div><nav id="nav"></nav><main id="main"></main>
<script>
const K='acc_v2';let D=null;
function fac(it,u){return (it.units.find(x=>x.name==u)||{factor:1}).factor}
try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!D){try{const o=JSON.parse(localStorage.getItem('acc_v1'));if(o){D={items:o.items,parties:[],buy:[],sell:[],cash:o.cash,seq:o.seq};
 o.buy.forEach(b=>{const it=o.items.find(i=>i.id==b.itemId);D.buy.push({id:b.id,date:b.date,pid:0,total:b.total,paid:b.total,lines:[{itemId:b.itemId,name:b.name,unit:b.unit,qty:b.qty,price:b.price,total:b.total,base:b.qty*(it?fac(it,b.unit):1)}]})});
 o.sell.forEach(s=>D.sell.push({id:s.id,date:s.date,pid:0,total:s.total,paid:s.total,cost:s.cost,lines:[{...s}]}))}}catch(e){}}
D=D||{items:[],parties:[],buy:[],sell:[],ret:[],cash:[],seq:1};D.ret=D.ret||[];D.pret=D.pret||[];
const save=()=>{try{syncKick()}catch(e){}try{ensureAccs()}catch(e){}try{stamp()}catch(e){}try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
/* ===== مزامنة: معرّف ثابت (uid) وتاريخ تعديل (mt) لكل سجل + رصد الحذف ===== */
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const SIG={},COLS=[['item','items'],['party','parties'],['buy','buy'],['sell','sell'],['ret','ret'],['pret','pret'],['cash','cash'],['jv','jv']];
const tracked=(t,x)=>t!='cash'||!String(x.ref||'').startsWith('inv:');
const sigOf=(t,x)=>{const o={};for(const k in x)if(k!='mt'&&k!='uid'&&!(t=='item'&&(k=='qty'||k=='cost'))&&!(t=='party'&&k=='acc'))o[k]=x[k];return JSON.stringify(o)};
function stamp(init){const now=Date.now(),seen=new Set();D.del=D.del||[];
 COLS.forEach(([t,c])=>(D[c]||[]).forEach(x=>{if(!tracked(t,x))return;
  if(!x.uid){x.uid=uid();x.mt=init?0:now}
  const s=sigOf(t,x),e=SIG[x.uid];
  if(!e)SIG[x.uid]={s,t};else if(e.s!==s){if(!init)x.mt=now;e.s=s}
  seen.add(x.uid)}));
 if(!init)for(const u in SIG)if(!seen.has(u)){const t=SIG[u].t;if(t!='item'&&t!='party')D.del.push({uid:u,t,mt:now});delete SIG[u]}}
const DEFCOA=()=>[['1010','الصندوق','asset'],['1020','المخزون','asset'],['1030','العملاء (ذمم مدينة)','asset'],['2010','الموردون (ذمم دائنة)','liab'],['3010','رأس المال والأرصدة الافتتاحية','equity'],['3020','مسحوبات المالك','equity'],['4010','إيرادات المبيعات','rev'],['4020','مردودات المبيعات','rev'],['4090','إيرادات أخرى','rev'],['5010','تكلفة البضاعة المباعة','exp'],['5110','الرواتب والأجور','exp'],['5120','الإيجار','exp'],['5130','الكهرباء والمياه','exp'],['5140','النقل والتوصيل','exp'],['5150','الاتصالات والإنترنت','exp'],['5160','الدعاية والإعلان','exp'],['5170','الصيانة','exp'],['5190','مصروفات متنوعة','exp']].map(([code,name,type])=>({code,name,type,sys:1}));
D.coa=D.coa||DEFCOA();
/* ===== النسخة التجريبية: 5 عمليات ثم التفعيل ===== */
const TRIAL=10;let LICOK=false;
const opsStored=()=>{try{return +localStorage.getItem('acc_ops')||0}catch(e){return 0}};
const docsCount=()=>D.buy.length+D.sell.length+D.ret.length+D.pret.length+D.cash.filter(c=>!String(c.ref||'').startsWith('inv:')).length;
const opsUsed=()=>Math.max(opsStored(),docsCount());
function bumpOp(){try{localStorage.setItem('acc_ops',String(Math.max(opsStored()+1,docsCount())))}catch(e){}}
function gate(){if(LICOK||opsUsed()<TRIAL)return true;licTick();return false}
D.del=D.del||[];D.sync=D.sync||{last:0};stamp(true);

const $=s=>document.querySelector(s),v=id=>$('#'+id).value;
const today=()=>new Date().toISOString().slice(0,10);
const f=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:(D.cur&&D.cur.dec!=null?D.cur.dec:2)});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const item=id=>D.items.find(i=>i.id==id),party=id=>D.parties.find(p=>p.id==id);
const cls=n=>n<0?'n':'p';
const tabOf=k=>k=='ret'?'sell':k=='pret'?'buy':k;
const tabs={items:'الأصناف',buy:'المشتريات',sell:'المبيعات',stock:'المخزون',cash:'الصندوق',parties:'العملاء والموردون',rep:'تقرير الأرباح',fin:'القوائم المالية',coa:'دليل الحسابات',trash:'المحذوفات',backup:'النسخ الاحتياطي',settings:'الإعدادات'};
let tab='items',C={},S=null,RR=null,E=null,CE=null,SF='',ST='',SM='sell',VR=null;const VIEW=location.hash.startsWith('#d=');
const MODS=[['stock','المخزون',['stock','items']],['buy','المشتريات',['buy']],['sell','المبيعات',['sell']],['acct','الحسابات',['coa','pay','rcv','jr','fin']],['parties','العملاء والموردون',['parties']],['rep','تقرير الأرباح',['rep']],['trash','المحذوفات',['trash']],['backup','النسخ الاحتياطي',['backup']],['settings','الإعدادات',['settings']]];
const SUBN={stock:'المخزون',items:'الأصناف',coa:'دليل الحسابات',pay:'سندات الصرف',rcv:'سندات القبض',jr:'قيود اليومية',fin:'القوائم المالية'};let CT='in';
const nav=()=>{$('#nav').innerHTML=MODS.filter(m=>can(m[0],1)&&modShown(m)).map(([k,t,sb])=>`<button class="${sb.includes(tab)?'on':''}" onclick="navTo('${(sb.find(x=>!hid(x))||sb[0])}')">${t}${k=='trash'&&(D.trash||[]).length?' ('+D.trash.length+')':''}</button>`).join('')};
const subNav=()=>{const m=MODS.find(x=>x[2].includes(tab)),sv=m?m[2].filter(k=>!hid(k)||k==tab):[];return m&&sv.length>1?`<div class="row" style="margin:0 0 10px">${sv.map(k=>`<button class="btn${k==tab?'':' s'}" onclick="navTo('${k}')">${SUBN[k]}</button>`).join('')}</div>`:''};
function go(t,keep){t=allowTab(t);if(t=='cash')t=CT=='in'?'rcv':'pay';if(!keep){C={lines:[],edit:null,dt:null,pt:'0',pa:''};S=null;E=null;CE=null;SF='';ST=''}tab=t;nav();$('#main').innerHTML=subNav()+V[t]();if(t=='buy'||t=='sell')fillUnits();upgradeSelects();addMics();addSearch()}
const itemOpts=()=>D.items.map(i=>`<option value="${i.id}"${C&&C.pl&&C.pl.itemId==i.id?' selected':''} data-s="${esc(i.barcode||'')}">${esc(i.name)}</option>`).join('');
function fillUnits(){const it=item(v('it'));if(!it)return;$('#un').innerHTML=it.units.map(u=>`<option>${esc(u.name)}</option>`).join('');if(tab=='sell')setPrice()}
function setPrice(){const it=item(v('it'));if(it)$('#pr').value=+(it.price*fac(it,v('un'))/(C.cc?C.rt||1:1)).toFixed(2)}
function breakdown(it){let q=it.qty,o=[];[...it.units].sort((a,b)=>b.factor-a.factor).forEach(u=>{const n=Math.floor(q/u.factor+1e-9);if(n>0){o.push(n+' '+u.name);q-=n*u.factor}});return o.join(' + ')||'0'}
function addCash(type,amount,note,date,pid,ref,vno){D.cash.push({id:D.seq++,date,type,amount:+amount,note,pid:+pid||0,ref:ref||'',vno:vno||'',by:curBy()})}
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function exp(name,rows){const csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');dl(name+'.csv',csv,'text/csv;charset=utf-8')}
const expBtn=(fn)=>`<button class="btn s" onclick="${fn}">⬇ تصدير إلى Excel</button>`;
const sgn=(p,c)=>(p.kind=='c'?c.type=='in':c.type=='out')?-c.amount:c.amount;
const jvBal=p=>(D.jv||[]).reduce((a,j)=>a+j.lines.filter(l=>l.acc==p.acc).reduce((t,l)=>t+(p.kind=='c'?(l.dr-l.cr):(l.cr-l.dr)),0),0),pbal=p=>jvBal(p)+D[p.kind=='c'?'sell':'buy'].filter(x=>x.pid==p.id).reduce((a,x)=>a+x.total-x.paid,0)+D.cash.filter(c=>c.pid==p.id&&c.ref=='pay').reduce((a,c)=>a+sgn(p,c),0)-(p.kind=='c'?D.ret.filter(x=>x.pid==p.id).reduce((a,x)=>a+x.total-x.paid,0):D.pret.filter(x=>x.pid==p.id).reduce((a,x)=>a+x.total-x.paid,0));
const V={
items(){const e=E?item(E):null,eu=e?e.units.slice(1).map(u=>u.name+'='+u.factor).join(', '):'';return `<div class="card"><h3>${e?'تعديل الصنف: '+esc(e.name):'إضافة صنف'}</h3><div class="g">
<div><label>اسم الصنف</label><input id="nm" value="${e?esc(e.name):''}"></div>
<div><label>الوحدة الأساسية (الأصغر)</label><input id="bu" placeholder="حبة" value="${e?esc(e.units[0].name):''}"></div>
<div><label>وحدات أكبر (اسم=عدد الأساسية)</label><input id="xu" placeholder="علبة=12, كرتون=144" value="${esc(eu)}"></div>
<div><label>سعر بيع الوحدة الأساسية</label><input id="sp" type="number" step="any" value="${e?e.price:''}"></div>
${e?`<div><label>التكلفة</label><input id="cs" type="number" step="any" value="${+e.cost.toFixed(4)}"></div><div><label>الكمية (أساسي)</label><input id="qy" type="number" step="any" value="${+e.qty.toFixed(4)}"></div>`:''}
<div><label>حد الطلب (بالوحدة الأساسية)</label><input id="iro" type="number" step="any" value="${e&&e.ro?e.ro:''}"></div><div><label>تاريخ الانتهاء (اختياري)</label><input id="iex" type="date" value="${e&&e.ex?e.ex:''}"></div><div><label>نوع الصنف</label><select id="ity"><option value="g" ${e&&e.ty=='s'?'':'selected'}>سلعي (مخزني)</option><option value="s" ${e&&e.ty=='s'?'selected':''}>خدمي (بدون مخزون)</option></select></div><div><label>البيع بكمية سالبة</label><select id="ineg"><option value="" ${e&&e.neg?'':'selected'}>افتراضي (حسب الإعدادات)</option><option value="a" ${e&&e.neg=='a'?'selected':''}>سماح</option><option value="b" ${e&&e.neg=='b'?'selected':''}>منع</option></select></div><div><label>الباركود</label><div style="display:flex;gap:6px"><input id="bc" value="${e&&e.barcode?esc(e.barcode):''}"><button class="btn s" type="button" onclick="scan(c=>{$('#bc').value=c})">📷</button></div></div>
<button class="btn" onclick="${e?'saveEdit()':'addItem()'}">${e?'حفظ التعديل':'حفظ'}</button>${e?'<button class="btn s" onclick="go(\'items\')">إلغاء</button>':''}</div></div>
<div class="card"><h3>استيراد أصناف</h3>
<div class="mu">الأعمدة بالترتيب (افصل بفاصلة أو Tab، ويمكنك لصقها مباشرة من Excel): الاسم | الوحدة الأساسية | وحدات أكبر (علبة=12;كرتون=144) | سعر البيع | التكلفة | الكمية الافتتاحية | الباركود — الخمسة الأخيرة اختيارية. الصنف الموجود بنفس الاسم يُحدَّث.</div>
<textarea id="imp" rows="4" style="margin-top:8px" placeholder="مثال:&#10;عصير,حبة,علبة=12;كرتون=144,2.5,1.8,200"></textarea>
<div class="row"><button class="btn" onclick="imp(v('imp'))">استيراد من النص</button><input type="file" id="fl" accept=".csv,.txt,.tsv" style="width:auto" onchange="impFile(this)"></div></div>
<div class="card w"><table><tr><th>الصنف</th><th>الباركود</th><th>الوحدات</th><th>سعر البيع</th><th>التكلفة</th><th>الكمية</th><th></th></tr>
${D.items.map(i=>`<tr><td>${esc(i.name)}${i.ty=='s'?' <span class="mu">(خدمي)</span>':''}${i.neg=='a'?' <span class="mu">(سالب مسموح)</span>':i.neg=='b'?' <span class="mu">(سالب ممنوع)</span>':''}${expTag(i)}${lowTag(i)}</td><td>${esc(i.barcode||'')}</td><td>${i.units.map(u=>esc(u.name)+(u.factor>1?' ('+u.factor+')':'')).join('، ')}</td><td>${f(i.price)}</td><td>${f(i.cost)}</td><td>${i.ty=='s'?'—':qtyFmt(i,i.qty)}</td><td><button class="btn s" onclick="editItem(${i.id})">تعديل</button> <button class="btn s d" onclick="delItem(${i.id})">حذف</button></td></tr>`).join('')||'<tr><td colspan="7" class="mu">لا توجد أصناف</td></tr>'}</table></div>`},
buy(){return `<div class="row" style="margin:0 0 10px"><button class="btn${BM=='buy'?'':' s'}" onclick="BM='buy';go('buy')">فاتورة شراء</button><button class="btn${BM=='pret'?'':' s'}" onclick="BM='pret';go('buy')">مردود مشتريات</button></div>`+inv(BM)},sell(){return `<div class="row" style="margin:0 0 10px"><button class="btn${SM=='sell'?'':' s'}" onclick="SM='sell';go('sell')">فاتورة بيع</button><button class="btn${SM=='ret'?'':' s'}" onclick="SM='ret';go('sell')">مردود مبيعات</button></div>`+inv(SM)},
stock(){const val=D.items.reduce((a,i)=>a+i.qty*i.cost,0);
 return `<div class="card k"><div>عدد الأصناف<b>${D.items.length}</b></div><div>قيمة المخزون (بالتكلفة)<b>${f(val)}</b></div></div>
<div class="card w">${expBtn('expStock()')}<table><tr><th>الصنف</th><th>الكمية</th><th>التفصيل</th><th>القيمة</th><th></th></tr>
${D.items.map(i=>`<tr><td>${esc(i.name)}</td><td class="${i.qty<=0?'n':''}">${qtyFmt(i,i.qty)}</td><td>${breakdown(i)}</td><td>${f(i.qty*i.cost)}</td><td><button class="btn s" onclick="openStock(${i.id})">+ مخزون افتتاحي</button></td></tr>`).join('')}</table></div>`},
cash(){const bal=accRoll(journal(),'1010'),e=CE?D.cash.find(c=>c.id==CE):null;
 const po=D.parties.map(p=>`<option value="${p.id}" ${e&&e.pid==p.id?'selected':''}>${esc(p.name)} (${p.kind=='c'?'عميل':'مورد'})</option>`).join('');
 return `<div class="card k"><div>إجمالي الصناديق والبنوك<b class="${cls(bal)}">${f(bal)}</b></div></div>
<div class="card"><h3>${e?'تعديل السند '+esc(e.vno||''):(CT=='in'?'سند قبض جديد':'سند صرف جديد')}</h3><div class="g">
<div><label>التاريخ</label><input id="dt" type="date" value="${e?e.date:today()}"></div><div><label>الصندوق / الحساب المالي</label><select id="fd" onchange="fdVch(this.value)">${fundOpts(e&&e.fd)}</select></div>
<div><label>نوع السند</label><select id="ty" disabled onchange="$('#ac').value=this.value=='in'?'4090':'5190'"><option value="in" ${(e?e.type:CT)=='in'?'selected':''}>سند قبض</option><option value="out" ${(e?e.type:CT)=='out'?'selected':''}>سند صرف</option></select></div>

<div style="display:flex;gap:6px;margin:8px 0"><input id="lk-dev" readonly value="${devId()}" dir="ltr" style="font-weight:700;letter-spacing:1px;text-align:center"><button class="btn s" onclick="navigator.clipboard&&navigator.clipboard.writeText(devId())">نسخ</button></div>

function showTrial(r){const el=$('#lic');if(el){el.className=r.left<=2?'n':'mu';el.innerHTML='نسخة تجريبية — المتبقي '+r.left+' من '+TRIAL+' عمليات · <a href="#" onclick="lockUI(\'\',1);return false" style="color:var(--ac);font-weight:700">تفعيل النظام</a>'}}
async function licTick(){const r=await licCheck();
 if(r.ok){LICOK=!r.trial;r.trial?showTrial(r):showLic(r);const o=$('#lock');if(o&&!o.dataset.manual)o.remove();return true}
 LICOK=false;const el=$('#lic');if(el)el.textContent='';if(!$('#lock'))lockUI(r.msg);return false}
async function activate(){const c=v('lk-code').trim();if(!c)return;
 const old=(()=>{try{return localStorage.getItem('acc_lic')}catch(e){return null}})();
 try{localStorage.setItem('acc_lic',c)}catch(e){}
 const r=await licCheck();
 if(r.ok){const o=$('#lock');if(o)o.remove();await licTick();go('items')}
 else{try{old?localStorage.setItem('acc_lic',old):localStorage.removeItem('acc_lic')}catch(e){}
  const o=$('#lock');if(o)o.remove();lockUI(r.msg||'رمز غير صالح')}}
const norm=t=>String(t||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
function upgradeSelects(){['it','pt','pp'].forEach(id=>{const s=document.getElementById(id);if(s&&s.tagName=='SELECT')acSelect(s)})}
function acSelect(sel){if(sel._ac)return;sel._ac=1;const par=sel.parentElement;par.style.position='relative';
 const inp=document.createElement('input'),lst=document.createElement('div');inp.className='acin';inp.autocomplete='off';inp.placeholder='اكتب للبحث…';lst.className='acl';lst.style.display='none';
 sel.style.display='none';sel.parentNode.insertBefore(inp,sel);sel.parentNode.insertBefore(lst,sel.nextSibling);
 const txt=()=>sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text:'',sync=()=>{inp.value=txt()};sync();
 let all=false;const matches=()=>{const q=all?'':norm(inp.value.trim());return [...sel.options].filter(o=>!q||norm(o.text).includes(q)||norm(o.dataset.s).includes(q))};
 const pick=o=>{sel.value=o.value;sel.dispatchEvent(new Event('change'));sync();lst.style.display='none';inp.blur()};
 const show=()=>{const m=matches().slice(0,8);lst.innerHTML='';m.forEach(o=>{const d=document.createElement('div');d.className='aci';d.textContent=o.text;d.addEventListener('pointerdown',e=>{e.preventDefault();pick(o)});lst.appendChild(d)});lst.style.display=m.length?'block':'none'};
 inp.addEventListener('focus',()=>{all=true;inp.select();show()});inp.addEventListener('input',()=>{all=false;show()});
 inp.addEventListener('keydown',e=>{if(e.key=='Enter'){e.preventDefault();const m=matches();if(m[0])pick(m[0])}});
 inp.addEventListener('blur',()=>setTimeout(()=>{all=false;lst.style.display='none';const m=matches();if(inp.value.trim()&&m.length==1&&norm(inp.value)!=norm(txt()))pick(m[0]);else sync()},150));
 sel.addEventListener('change',sync)}
function toNum(t){const m=String(t).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/[,،\s]/g,'').match(/-?\d+(\.\d+)?/);return m?m[0]:''}
function addMics(){document.querySelectorAll('#main input,#main textarea').forEach(i=>{
 if(i._mic||i.readOnly||i.disabled||i.id=='bc'||i.id=='imp')return;const ty=i.type||'text';
 if(i.tagName!='TEXTAREA'&&!['text','number','search','tel'].includes(ty))return;
 i._mic=1;const par=i.parentElement,flex=par&&par.style.display==='flex';
 const b=document.createElement('button');b.type='button';b.className='mic'+(flex?' fl':'');b.textContent='🎤';b.title='إدخال صوتي';b.onclick=()=>startVoice(i,b);
 if(flex)i.after(b);else{par.style.position='relative';i.classList.add('hasmic');par.appendChild(b)}})}
function startVoice(inp,btn){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return alert('الإدخال الصوتي غير مدعوم في هذا المتصفح. استخدم Chrome على الأندرويد.');
 if(VR){try{VR.stop()}catch(e){}VR=null;return}
 const r=new SR();VR=r;r.lang=(D.co&&D.co.vl)||'ar-SA';r.interimResults=false;r.maxAlternatives=1;btn.classList.add('rec');
 r.onresult=e=>{let t=e.results[0][0].transcript.trim();
  if(inp.type=='number'){t=toNum(t);if(t==='')return alert('لم يُفهم الرقم، حاول مرة أخرى');inp.value=t}else inp.value=t;
  inp.dispatchEvent(new Event('input',{bubbles:true}));if(inp.classList.contains('acin'))inp.focus()};
 r.onerror=e=>alert(e.error=='not-allowed'?'اسمح للمتصفح باستخدام الميكروفون ثم أعد المحاولة':e.error=='no-speech'?'لم يُسمع صوت':'تعذّر التعرف على الصوت (يلزم اتصال بالإنترنت)');
 r.onend=()=>{btn.classList.remove('rec');VR=null};
 try{r.start()}catch(e){VR=null;btn.classList.remove('rec')}}
{const o=V.act;V.act=function(){return rqBox()+'<div class="rptb">'+o.apply(this,arguments)+'</div>'}}
if(VIEW){viewDoc()}else{licTick().then(ok=>{if(ok)go('items')});setInterval(licTick,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)licTick()})}

/* جسر الملفات للتطبيق الأصلي (أندرويد): حفظ ومشاركة الملفات بدل التنزيل المباشر */
(function(){const _dl=dl;dl=function(name,data,type){const Cp=window.Capacitor,P=Cp&&Cp.Plugins;
 if(!(Cp&&Cp.isNativePlatform&&Cp.isNativePlatform()&&P&&P.Filesystem&&P.Share))return _dl(name,data,type);
 const b=data instanceof Blob?data:new Blob([data],{type:type||'application/octet-stream'}),r=new FileReader();
 r.onload=async()=>{try{const w=await P.Filesystem.writeFile({path:name,data:String(r.result).split(',')[1],directory:'CACHE'});await P.Share.share({title:name,url:w.uri,dialogTitle:'حفظ / مشاركة الملف'})}catch(e){alert('تعذر حفظ الملف: '+(e&&e.message||e))}};r.readAsDataURL(b)}})();
</script></body></html>
