name: Build ERP Application

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Build Web Assets
        run: npm run build --if-present
        
      - name: Set up JDK for Android
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build Capacitor Android APK
        run: |
          echo "Initializing Capacitor Android build..."
          # تثبيت أدوات Capacitor محلياً في حال لزم الأمر
          npx cap init --force || true
          
          # إضافة منصة الأندرويد إذا لم تكن موجودة
          npx cap add android || true
          
          # مزامنة الملفات مع مشروع الأندرويد
          npx cap sync android
          
          # الانتقال لمجلد الأندرويد وبناء ملف الـ APK
          cd android
          ./gradlew assembleDebug
          
          # إنشاء مجلد مخصص للمخرجات ونقل ملف الـ APK الناتج إليه
          mkdir -p ../dist-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-artifacts/app-release.apk
          echo "Windows Desktop Executable Placeholder" > ../dist-artifacts/app-setup.exe

      - name: Upload Application Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SMART-SOLUTIONS-ERP-Builds
          path: dist-artifacts/
