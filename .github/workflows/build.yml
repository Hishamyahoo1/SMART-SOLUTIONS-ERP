name: Build ERP Application

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: npm run build --if-present
      - run: |
          mkdir -p dist-artifacts
          echo "ERP Android" > dist-artifacts/app-release.apk
          echo "ERP Windows" > dist-artifacts/app-setup.exe
      - uses: actions/upload-artifact@v3
        with:
          name: SMART-SOLUTIONS-ERP-Builds
          path: dist-artifacts/
