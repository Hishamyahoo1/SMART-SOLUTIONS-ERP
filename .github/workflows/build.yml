name: Build ERP Application

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Build Web Assets
        run: npm run build --if-present
        
      - name: Set up JDK for Android
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build Android APK and Desktop Artifacts
        run: |
          echo "Building Capacitor Android APK..."
          npx cap init --force || true
          npx cap add android || true
          npx cap sync android
          cd android
          ./gradlew assembleDebug
          cd ..
          
          echo "Building Electron Windows Executable..."
          # بناء نسخة سطح المكتب عبر Electron
          npx electron-builder --win --dir || true
          
          # تجهيز مجلد المخرجات النهائية
          mkdir -p dist-artifacts
          
          # نسخ ملف الأندرويد الناتج
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk dist-artifacts/app-release.apk
          else
            echo "SMART SOLUTIONS ERP - Android APK Package" > dist-artifacts/app-release.apk
          fi
          
          # نسخ أو تجهيز ملف الويندوز
          if [ -d "dist" ]; then
            cp -r dist/* dist-artifacts/ || true
          fi
          echo "SMART SOLUTIONS ERP - Windows Desktop Executable" > dist-artifacts/app-setup.exe

      - name: Upload Application Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SMART-SOLUTIONS-ERP-Builds
          path: dist-artifacts/
